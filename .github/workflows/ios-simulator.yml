name: iOS build (simulator, no signing)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor iOS (runs pod install)
        run: npx cap sync ios
      - name: Build for simulator
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max'
          -derivedDataPath build
          clean build
          CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: App-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
      - name: Package ready-to-open Xcode project (Pods installed)
        run: |
          rm -rf ready
          mkdir -p ready/noticemitra/ios ready/noticemitra/node_modules/@capacitor ready/noticemitra/node_modules/@capacitor-community
          ditto ios/App ready/noticemitra/ios/App
          ditto node_modules/@capacitor/ios ready/noticemitra/node_modules/@capacitor/ios
          ditto node_modules/@capacitor-community/speech-recognition ready/noticemitra/node_modules/@capacitor-community/speech-recognition
          cd ready && ditto -c -k --sequesterRsrc --keepParent noticemitra ../noticemitra-ios-project-ready.zip
      - name: Upload ready Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-ready
          path: noticemitra-ios-project-ready.zip
